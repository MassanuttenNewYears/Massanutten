<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://vxevjynsfzemnzqxcfgt.supabase.co; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Log in | Massanutten New Year's</title>
  <link rel="icon" href="./favicon.png">
  <link rel="stylesheet" href="./styles.css?v=10">
  <style>
    body { display: grid; place-items: center; overflow: hidden; }
    .mountains {
      position: fixed; inset: auto 0 0 0; height: 24vh; pointer-events: none; z-index: 0;
      background: linear-gradient(180deg, #c9dcf2 0%, #7f9dc0 100%);
      opacity: .55;
      clip-path: polygon(0 100%, 0 55%, 18% 20%, 32% 50%, 50% 5%, 68% 45%, 82% 25%, 100% 60%, 100% 100%);
    }
    .card { width: min(380px, 92vw); padding: 2rem 1.75rem; }
    .card h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
    .card h1 span { color: var(--ice); }
    .sub { margin: 0 0 1.5rem; color: var(--ice-dim); font-size: .95rem; }
    button[type="submit"] { width: 100%; margin-top: 1.4rem; }
    #status { margin: 1rem 0 0; text-align: center; }
  </style>
</head>
<body>
  <div class="mountains" aria-hidden="true"></div>

  <main class="card">
    <h1>Massanutten <span>New Year's</span></h1>
    <p class="sub" id="sub">Sign in to warm up.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" maxlength="254" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" maxlength="72" autocomplete="current-password" required>
      <button id="submit" type="submit">Log in</button>
    </form>
    <p id="status" class="status" role="status"></p>
  </main>

  <script src="./vendor/supabase-js-2.117.3.umd.js?v=10"></script>
  <script src="./snow.js?v=10"></script>
  <script type="module" src="./login.js?v=10"></script>
</body>
</html>
